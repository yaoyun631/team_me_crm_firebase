{# v27 極簡 AI 屋主回報區塊
   用法：把 templates/seller_detail.html 裡原本「AI 生成屋主回報」與「新增屋主回報」那一大段，替換成這段。
   這段只保留一個欄位，結果會導到 /assistant/owner-report-ai 同頁顯示。
#}
<div class="card" style="border:1px solid #eadfce;border-radius:18px;padding:16px;background:#fffdf9;margin-bottom:16px;">
  <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;">
    <h3 style="margin:0;font-size:18px;">AI 屋主回報</h3>
    <a href="{{ url_for('assistant_owner_report_ai', seller_id=seller.id) }}" style="font-size:13px;color:#8a6c4b;text-decoration:none;">開啟完整頁</a>
  </div>

  <form method="post" action="{{ url_for('seller_owner_report_ai_generate', seller_id=seller.id) }}">
    <label style="display:block;font-weight:700;margin-bottom:8px;">這次想跟屋主說什麼？</label>
    <textarea name="focus_note" rows="5" style="width:100%;border:1px solid #eadfce;border-radius:14px;padding:12px;line-height:1.6;resize:vertical;" placeholder="例：本週詢問3組、帶看1組，客人喜歡格局但覺得總價偏高。想委婉跟屋主說明市場反應，並鋪陳後續可以討論價格或行銷方向。"></textarea>
    <button type="submit" style="margin-top:10px;width:100%;border:0;border-radius:14px;background:#f7a51f;color:white;padding:11px 14px;font-weight:800;cursor:pointer;">生成給屋主的話</button>
  </form>
</div>
