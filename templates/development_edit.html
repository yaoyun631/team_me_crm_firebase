{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">編輯開發資料</h3>
<div class="card">
  <div class="card-body">
    <form method="post">
{% set item_visibility = development.visibility or 'public' %}
{% set owner_line_user_id = development.owner_line_user_id or '' %}

      <div class="mb-3"><label class="form-label">姓名</label><input type="text" name="name" class="form-control" value="{{ development.name or '' }}"></div>
      <div class="mb-3"><label class="form-label">電話</label><input type="text" name="phone" class="form-control" value="{{ development.phone or '' }}"></div>
      <div class="mb-3"><label class="form-label">來源</label><input type="text" name="source" class="form-control" value="{{ development.source or '' }}"></div>
      <div class="mb-3"><label class="form-label">地址</label><input type="text" name="address" class="form-control" value="{{ development.address or '' }}"></div>
      <div class="mb-3"><label class="form-label">戶籍地址</label><input type="text" name="registered_address" class="form-control" value="{{ development.registered_address or '' }}"></div>
      <div class="mb-3"><label class="form-label">網址</label><input type="text" name="url" class="form-control" value="{{ development.url or '' }}"></div>
      <div class="mb-3"><label class="form-label">目前狀態</label>
        <select name="current_stage" class="form-select">
          {% for opt in (status_options or development_current_stage_options or []) %}
            <option value="{{ opt }}" {% if (development.current_stage or development.stage) == opt %}selected{% endif %}>{{ opt }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3"><label class="form-label">下一動作</label>
        <select name="next_action" class="form-select">
          <option value="">請選擇</option>
          {% for opt in (next_action_options or development_next_action_options or []) %}
            <option value="{{ opt }}" {% if development.next_action == opt %}selected{% endif %}>{{ opt }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3"><label class="form-label">下次日期</label><input type="date" name="next_action_date" class="form-control" value="{{ development.next_action_date or '' }}"></div>
      <div class="mb-3"><label class="form-label">內部備註</label><textarea name="note" class="form-control" rows="4">{{ development.note or '' }}</textarea></div>
    

  <div class="card border-warning mb-3">
    <div class="card-header bg-warning bg-opacity-25 fw-bold">LINE 顯示設定</div>
    <div class="card-body">
      <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">資料可見性</label>
      <select name="visibility" class="form-select crm-visibility-select">
        <option value="public" {% if item_visibility != 'personal' %}selected{% endif %}>公開資料（可傳到設定允許的群組）</option>
        <option value="personal" {% if item_visibility == 'personal' %}selected{% endif %}>個人資料（只傳給綁定的個人 LINE）</option>
      </select>
    </div>
    <div class="col-md-6 crm-owner-line-wrap">
      <label class="form-label">綁定個人 LINE</label>
      <select name="owner_line_user_id" class="form-select">
        <option value="">請選擇個人 LINE 帳號</option>
        {% for u in line_user_options or [] %}
      <option value="{{ u.user_id }}" {% if owner_line_user_id == u.user_id %}selected{% endif %}>{{ u.name }}{% if not u.enabled %}（停用）{% endif %}</option>
        {% endfor %}
      </select>
      <div class="form-text">個人資料會單獨推送給這個 LINE 帳號。</div>
    </div>
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">儲存變更</button>
      <a href="{{ url_for('development_detail', development_id=development.id) }}" class="btn btn-secondary">取消</a>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  function refreshCrmVisibility() {
    document.querySelectorAll('.crm-visibility-select').forEach(function(sel){
      const form = sel.closest('form');
      const wrap = form ? form.querySelector('.crm-owner-line-wrap') : null;
      if (wrap) wrap.style.display = sel.value === 'personal' ? '' : 'none';
    });
  }
  document.querySelectorAll('.crm-visibility-select').forEach(function(sel){
    sel.addEventListener('change', refreshCrmVisibility);
  });
  refreshCrmVisibility();
});
</script>

{% endblock %}
