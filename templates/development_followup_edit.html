{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">編輯開發追蹤紀錄</h3>
<form method="post">
  <div class="mb-3"><label class="form-label">聯絡時間</label><input type="datetime-local" name="contact_time" class="form-control" value="{{ followup.contact_time|replace(' ', 'T') if followup.contact_time else '' }}"></div>
  <div class="mb-3"><label class="form-label">聯絡方式</label><input type="text" name="channel" class="form-control" value="{{ followup.channel or '' }}"></div>
  <div class="mb-3"><label class="form-label">目前狀態</label>
    <select name="current_stage" class="form-select">
      <option value="">不變更</option>
      {% for opt in status_options %}
        <option value="{{ opt }}" {% if (followup.current_stage or followup.stage) == opt %}selected{% endif %}>{{ opt }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3"><label class="form-label">下一動作</label>
    <select name="next_action" class="form-select">
      <option value="">不變更</option>
      {% for opt in next_action_options %}
        <option value="{{ opt }}" {% if followup.next_action == opt %}selected{% endif %}>{{ opt }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3"><label class="form-label">下次日期</label><input type="date" name="next_action_date" class="form-control" value="{{ followup.next_action_date or followup.next_contact_date or '' }}"></div>
  <div class="mb-3"><label class="form-label">戶籍地址</label><input type="text" name="registered_address" class="form-control" value="{{ followup.registered_address or '' }}"></div>
  <div class="mb-3"><label class="form-label">聯絡內容紀錄</label><textarea name="content" class="form-control" rows="3">{{ followup.content or '' }}</textarea></div>
  <button type="submit" class="btn btn-primary">儲存變更</button>
  <a href="{{ url_for('development_detail', development_id=development_id) }}" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
