{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <div>
    <h3 class="mb-0">LINE 卡片設定</h3>
    <div class="small text-muted mt-1">控制行事曆卡片在 LINE Bot 回覆時要顯示哪些內容。</div>
  </div>
  <div class="d-flex gap-2 flex-wrap">
    <a href="{{ url_for('calendar_page') }}" class="btn btn-outline-secondary">返回行事曆</a>
  </div>
</div>

<form method="post" class="card shadow-sm">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-12">
        <h5 class="mb-2">卡片標題</h5>
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">今日行程標題</label>
        <input type="text" name="title_today" class="form-control"
               value="{{ settings.title_today or '您今天的行程如下：' }}">
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">明日行程標題</label>
        <input type="text" name="title_tomorrow" class="form-control"
               value="{{ settings.title_tomorrow or '您明天的行程如下：' }}">
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">本週行程標題</label>
        <input type="text" name="title_week" class="form-control"
               value="{{ settings.title_week or '您本週的行程如下：' }}">
      </div>

      <div class="col-12"><hr></div>

      <div class="col-12">
        <h5 class="mb-2">卡片顏色</h5>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">主色</label>
        <input type="text" name="primary_color" class="form-control"
               placeholder="#C9874A"
               value="{{ settings.primary_color or '#C9874A' }}">
        <div class="form-text">建議使用 HEX 色碼，例如 #C9874A。</div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">按鈕色</label>
        <input type="text" name="button_color" class="form-control"
               placeholder="#C9874A"
               value="{{ settings.button_color or '#C9874A' }}">
      </div>

      <div class="col-12"><hr></div>

      <div class="col-12">
        <h5 class="mb-2">行事曆時間</h5>
      </div>

      <div class="col-6 col-md-3">
        <label class="form-label">開始小時</label>
        <input type="number" name="calendar_start_hour" class="form-control" min="0" max="23"
               value="{{ settings.calendar_start_hour or 8 }}">
      </div>

      <div class="col-6 col-md-3">
        <label class="form-label">結束小時</label>
        <input type="number" name="calendar_end_hour" class="form-control" min="0" max="23"
               value="{{ settings.calendar_end_hour or 22 }}">
      </div>

      <div class="col-12"><hr></div>

      <div class="col-12">
        <h5 class="mb-2">LINE 卡片顯示內容</h5>
      </div>

      <div class="col-12 col-md-6">
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" name="show_customer" id="show_customer"
                 {% if settings.show_customer %}checked{% endif %}>
          <label class="form-check-label" for="show_customer">顯示客戶姓名</label>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" name="show_phone" id="show_phone"
                 {% if settings.show_phone %}checked{% endif %}>
          <label class="form-check-label" for="show_phone">顯示電話</label>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" name="show_location" id="show_location"
                 {% if settings.show_location %}checked{% endif %}>
          <label class="form-check-label" for="show_location">顯示地點</label>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" name="show_note" id="show_note"
                 {% if settings.show_note %}checked{% endif %}>
          <label class="form-check-label" for="show_note">顯示備註</label>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" name="show_quick_actions" id="show_quick_actions"
                 {% if settings.show_quick_actions %}checked{% endif %}>
          <label class="form-check-label" for="show_quick_actions">顯示快速操作按鈕</label>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" name="line_only_enabled_events" id="line_only_enabled_events"
                 {% if settings.line_only_enabled_events %}checked{% endif %}>
          <label class="form-check-label" for="line_only_enabled_events">LINE 只顯示有勾選的行程</label>
        </div>
      </div>

      <div class="col-12"><hr></div>

      <div class="col-12">
        <label class="form-label">快速操作按鈕文字</label>
        <textarea name="quick_actions" class="form-control" rows="5" placeholder="新增行程&#10;今日行程&#10;本週行程&#10;客戶查詢&#10;設定提醒">{{ quick_actions_text }}</textarea>
        <div class="form-text">一行一個，或用逗號分隔。例如：新增行程、今日行程、本週行程。</div>
      </div>
    </div>
  </div>

  <div class="card-footer bg-white d-flex justify-content-end gap-2 flex-wrap">
    <a href="{{ url_for('calendar_page') }}" class="btn btn-outline-secondary">取消</a>
    <button type="submit" class="btn btn-primary">儲存設定</button>
  </div>
</form>

{% endblock %}
